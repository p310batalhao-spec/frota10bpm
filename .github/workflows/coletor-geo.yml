name: Coletor GEO — 10º BPM

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rodar coletor
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: node coletor-geo-actions.js
